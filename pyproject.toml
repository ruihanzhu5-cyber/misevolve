[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misevolve"
version = "0.1.0"
description = "A controlled benchmark for persistent safety failures in self-evolving agent skills."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Xutao Mao"},
    {name = "Liangjie Zhao"},
    {name = "Xiang Zheng"},
    {name = "Cong Wang"},
]
keywords = [
    "agent-safety",
    "llm-security",
    "skill-evolution",
    "benchmark",
    "red-team",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "anthropic>=0.30",
    "openai>=1.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
misevolve = "misevolve.run:main"
misevolve-metrics = "misevolve.bench.metrics:main"

[project.urls]
Repository = "https://github.com/henrymao2004/misevolve"
Documentation = "https://github.com/henrymao2004/misevolve/tree/main/docs"
Issues = "https://github.com/henrymao2004/misevolve/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/misevolve"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "misevolve/_bundled/configs"
"data" = "misevolve/_bundled/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I"]
